name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-cpp
        with:
          build_type: ${{ matrix.build_type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quiver-${{ matrix.os }}-${{ matrix.build_type }}
          retention-days: 7
          path: |
            build/lib/*
            build/bin/*

  cpp-coverage:
    name: C++ Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - uses: ./.github/actions/build-cpp
        with:
          coverage: "true"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '${{ github.workspace }}/tests/*' --output-file coverage.info --ignore-errors mismatch
          lcov --list coverage.info --ignore-errors mismatch

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          flags: cpp
          fail_ci_if_error: true
          disable_search: true
          # The CLI's gcov plugin would re-run gcov over build/ and upload tests/ and _deps/.
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}

  julia-coverage:
    name: Julia Coverage
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [1.11, 1.12, 1.13]

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: ./.github/actions/build-cpp

      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: bindings/julia

      - uses: julia-actions/julia-runtest@v1
        with:
          project: bindings/julia
          coverage: true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: bindings/julia/src

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: julia
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  dart-coverage:
    name: Dart Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Install Dart dependencies
        working-directory: bindings/dart
        run: dart pub get

      - name: Run tests with coverage
        working-directory: bindings/dart
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage --out=coverage

      - name: Filter coverage (exclude generated FFI bindings)
        working-directory: bindings/dart
        run: |
          lcov --remove coverage/lcov.info 'lib/src/ffi/bindings.dart' -o coverage/lcov.info
          lcov --list coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: bindings/dart/coverage/lcov.info
          flags: dart
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/build-cpp

      - name: Install dependencies
        working-directory: bindings/python
        run: |
          uv venv
          uv pip install pytest pytest-cov
          uv pip install -e .

      - name: Run tests with coverage
        working-directory: bindings/python
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          uv run pytest --cov=quiverdb --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: bindings/python/coverage.xml
          flags: python
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  clang-format:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly (PyPI wheel); .clang-format uses 22-only keys. Keep in sync with
      # .pre-commit-config.yaml.
      - uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: |
          find include src tests -name '*.cpp' -o -name '*.h' | xargs uvx --from clang-format==22.1.8 clang-format --dry-run --Werror

  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz \
            | tar -xz actionlint

      # Validate workflow structure: needs/uses references, ${{ }} expressions, runner labels,
      # reusable-workflow wiring. shellcheck integration is disabled (-shellcheck=) to keep this
      # gate focused on workflow wiring and avoid failing on pre-existing bash style in run:
      # blocks; a dedicated shell-lint pass can be added later.
      - name: Lint workflows
        run: ./actionlint -color -shellcheck=

  bun-test:
    name: Bun Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/build-cpp

      - name: Install JS dependencies
        working-directory: bindings/js
        run: bun install

      - name: Run Bun tests (Linux)
        if: runner.os == 'Linux'
        working-directory: bindings/js
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: bun test test --coverage --coverage-reporter=lcov

      - name: Run Bun tests (Windows)
        if: runner.os == 'Windows'
        working-directory: bindings/js
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\bin\Debug;$env:PATH"
          bun test test

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: bindings/js/coverage/lcov.info
          flags: js
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
