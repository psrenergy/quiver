name: Resolve Version

# Reusable: the version the checkout of `ref` declares. Called by publish-s3.yml and publish-julia.yml.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: v
        run: |
          v="$(python3 scripts/assert_version.py)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
