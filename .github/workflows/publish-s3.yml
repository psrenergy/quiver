name: Publish S3

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Override ref or sha"
        required: false
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: v
        run: |
          v="$(python3 scripts/assert_version.py)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build native libs (${{ matrix.platform_key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform_key: linux-x86_64
            arch: x86_64
            lib_paths: |
              build/manylinux-x86_64/lib/libquiver.so
              build/manylinux-x86_64/lib/libquiver.so.0
              build/manylinux-x86_64/lib/libquiver_c.so
          - os: ubuntu-24.04-arm
            platform_key: linux-aarch64
            arch: aarch64
            lib_paths: |
              build/manylinux-aarch64/lib/libquiver.so
              build/manylinux-aarch64/lib/libquiver.so.0
              build/manylinux-aarch64/lib/libquiver_c.so
          - os: macos-latest
            platform_key: macos-aarch64
            lib_paths: |
              build/lib/libquiver.0.dylib
              build/lib/libquiver_c.dylib
          - os: windows-latest
            platform_key: windows-x86_64
            lib_paths: |
              build/bin/Release/libquiver.dll
              build/bin/Release/libquiver_c.dll

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # macOS + Windows keep the host composite (host toolchain + FetchContent/sccache caching)
      - uses: ./.github/actions/build-cpp
        if: runner.os != 'Linux'
        with:
          build_type: Release
          build_tests: "OFF"

      # Linux: build the native libs inside manylinux via Docker (x86_64: manylinux2014, glibc 2.17;
      # aarch64: manylinux_2_28, glibc 2.28). This is the SAME script a developer runs locally
      # (`bash scripts/build_native_linux.sh [aarch64]`) — it only needs Docker, which the stock
      # ubuntu runners already provide. It builds + patchelfs the $ORIGIN rpath + runs the portability
      # gate (glibc floor, GLIBCXX<=3.4.30, dynamic libstdc++) in-container. Why manylinux/Docker and
      # not BinaryBuilder / a job-level container: / a CMake flag: see .github/AGENTS.md "glibc floor".
      - name: Build + verify Linux libs (manylinux)
        if: runner.os == 'Linux'
        run: bash scripts/build_native_linux.sh ${{ matrix.arch }}

      - name: Set RPATH for macOS
        if: runner.os == 'macOS'
        run: |
          install_name_tool -add_rpath '@loader_path' build/lib/libquiver_c.dylib
          codesign --force --sign - build/lib/libquiver_c.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform_key }}
          path: ${{ matrix.lib_paths }}

  upload-s3:
    name: Upload native libs to S3
    runs-on: [self-hosted, linux]
    needs: [build, version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download Linux x86_64 native libraries
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x86_64
          path: native/linux-x86_64

      - name: Download Linux aarch64 native libraries
        uses: actions/download-artifact@v8
        with:
          name: native-linux-aarch64
          path: native/linux-aarch64

      - name: Download macOS aarch64 native libraries
        uses: actions/download-artifact@v8
        with:
          name: native-macos-aarch64
          path: native/macos-aarch64

      - name: Download Windows x86_64 native libraries
        uses: actions/download-artifact@v8
        with:
          name: native-windows-x86_64
          path: native/windows-x86_64

      - name: Upload native libs to S3
        run: bash scripts/ci/native_s3.sh upload "${{ needs.version.outputs.version }}"
