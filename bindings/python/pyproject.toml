[project]
name = "quiverdb"
version = "0.13.6"
requires-python = ">=3.13"
dependencies = ["cffi>=2.0.0"]

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
wheel.packages = ["src/quiverdb"]
wheel.exclude = ["bin", "lib", "include", "share"]

[dependency-groups]
dev = ["pytest>=8.4.1", "ruff>=0.12.2"]

[tool.cibuildwheel]
build = ["cp313-win_amd64", "cp313-manylinux_x86_64", "cp313-manylinux_aarch64", "cp313-macosx_arm64"]
test-requires = ["pytest"]
test-command = [
    "python {project}/scripts/validate_wheel_install.py",
    "pytest {project}/bindings/python/tests",
]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "13.3"
