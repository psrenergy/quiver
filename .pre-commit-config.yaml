repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # tests/fixtures/*.csv are byte-exact by design (leading UTF-8 BOM, CRLF endings) -- that is
      # what the db:read_csv parser tests assert. .gitattributes marks them -text so git never
      # normalizes them; these excludes stop the hooks from rewriting them on the way in.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: (^tests/fixtures/|\.bat$)
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Same clang-format version CI pins (.github/workflows/ci.yml).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^(include|src|tests)/.*\.(cpp|h)$

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        files: ^(include|src|tests)/.*\.(cpp|h)$
